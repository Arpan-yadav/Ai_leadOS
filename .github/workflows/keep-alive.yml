name: Keep API & Database Alive

on:
  schedule:
    # Runs twice a day (every 12 hours) to prevent the Supabase 7-day pause 
    # and keep the Render instance warmed up periodically.
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API (Login Endpoint)
        # This sends a dummy login request. It will return a 401 Unauthorized, 
        # but crucially, it forces Render to wake up and queries the Supabase database.
        run: |
          curl -X POST https://ai-leados.onrender.com/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@portfolio.com","password":"dummy-ping"}'
